spring.application.name=itsm-backend

server.port=${PORT:8080}

# PostgreSQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/itsm_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:itsm_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA and Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# JWT Configuration
jwt.secret=${JWT_SECRET:ITSMSecretKeyForJWTTokenGenerationPleaseChangeInProductionAtLeast256Bits}
jwt.expiration.ms=86400000

# CORS - Frontend origins
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Scheduling (for SLA monitoring)
spring.task.scheduling.pool.size=5

# Logging
logging.level.com.itsm=INFO
logging.level.org.springframework.security=WARN

# Multipart
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

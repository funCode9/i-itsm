services:
  # Backend Web Service (Spring Boot 4 / Java 21)
  - type: web
    name: i-itsm-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: singapore
    healthCheckPath: /api/auth/health
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://ep-green-bread-aoohsox1.c-2.ap-southeast-1.aws.neon.tech/i-itsm-db?sslmode=require
      - key: SPRING_DATASOURCE_USERNAME
        value: i-itsm-db_owner
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: "http://localhost:5173,https://*.onrender.com,https://*.vercel.app,https://*.netlify.app"

  # Frontend Static Site (React 18 + Vite SPA)
  - type: web
    name: i-itsm-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    region: singapore
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

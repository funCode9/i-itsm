services:
  postgres:
    image: postgres:16-alpine
    container_name: itsm-postgres
    environment:
      POSTGRES_DB: itsm_db
      POSTGRES_USER: itsm_user
      POSTGRES_PASSWORD: itsm_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: itsm-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/itsm_db
      SPRING_DATASOURCE_USERNAME: itsm_user
      SPRING_DATASOURCE_PASSWORD: itsm_password
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  postgres_data:
